[package]
name = "casc-lib"
version = "0.2.1"
edition = "2024"
description = "Pure Rust library for reading World of Warcraft CASC archives"
license = "MIT"
authors = ["Xerrion"]
repository = "https://github.com/Xerrion/casc-extractor"
homepage = "https://github.com/Xerrion/casc-extractor"
readme = "README.md"
keywords = ["casc", "wow", "blizzard", "game", "archive"]
categories = ["parser-implementations", "game-development"]

[dependencies]
csv = "1.4.0"
flate2 = "1.1.10"
glob = "0.3.4"
hex = "0.4.3"
lz4_flex = "0.14.0"
md-5 = "0.11.0"
memmap2 = "0.9.12"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
salsa20 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
